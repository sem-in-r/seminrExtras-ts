# Mirrors seminr-ts's CI (../seminr-ts/.github/workflows/ci.yml): every push to
# the default branch, every PR, and manual dispatch, across all three OSes
# without fail-fast. Steps track this package's scripts (there is no smoke:pack
# here; the demos self-import the built @seminr/extras, so build runs first).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    name: ${{ matrix.os }} (bun latest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run typecheck:demos
      - run: bun test
      - name: Demo smoke
        run: bun run demos/pls-cvpat.ts
